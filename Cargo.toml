[package]
name = "corgikart"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
bevy = { version = "0.19.1", features = ["serialize", "bevy_solari", "bluenoise_texture"] }
# Same version Bevy uses; only needed to probe the GPU for ray tracing support before startup.
wgpu = { version = "29", default-features = false, features = ["vulkan", "metal", "dx12", "wgsl", "std"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3.3"

[features]
# NVIDIA DLSS Ray Reconstruction for the raytraced renderer (denoising + upscaling).
# Needs the DLSS SDK: DLSS_SDK=/path/to/DLSS VULKAN_SDK=/usr cargo build --release --features dlss
dlss = ["bevy/dlss"]

# Bevy is very slow without optimisations; optimise deps fully and our code a little.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
